<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRA Downloader Web</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 400px;
            text-align: center;
        }
        h2 { color: #bb86fc; margin-bottom: 20px; }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #333;
            background-color: #2c2c2c;
            color: #fff;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            background-color: #bb86fc;
            color: #121212;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        button:hover { background-color: #9965f4; }
        #status { margin-top: 15px; font-size: 14px; color: #03dac6; }
    </style>
</head>
<body>

    <div class="container">
        <h2>HRA Downloader</h2>
        <input type="text" id="urlInput" placeholder="Pega el enlace del álbum de HighResAudio...">
        <button onclick="descargarAlbum()">Iniciar Descarga</button>
        <p id="status"></p>
    </div>

    <script>
        async function descargarAlbum() {
            const url = document.getElementById('urlInput').value;
            const statusText = document.getElementById('status');

            if (!url) {
                statusText.style.color = '#cf6679';
                statusText.innerText = 'Por favor, introduce un enlace válido.';
                return;
            }

            statusText.style.color = '#03dac6';
            statusText.innerText = 'Procesando descarga... Revisa tu terminal.';

            try {
                const response =- await fetch('/descargar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                const result = await response.json();
                if (response.ok) {
                    statusText.innerText = '¡Descarga finalizada con éxito!';
                } else {
                    statusText.style.color = '#cf6679';
                    statusText.innerText = 'Error: ' + result.error;
                }
            } catch (error) {
                statusText.style.color = '#cf6679';
                statusText.innerText = 'Error de conexión con el servidor.';
            }
        }
    </script>
</body>
</html>
